<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceHub 语音助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; background: #0f172a; color: #e2e8f0; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.6rem; }
        .header p { color: #94a3b8; margin-top: .4rem; }
        .status-bar { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
        .status { padding: 0.5rem 1rem; border-radius: 0.25rem; background: #1e293b; font-size: .9rem; }
        .status.active { background: #22c55e; color: #052e16; font-weight: 600; }
        .status.connecting { background: #eab308; color: #422006; font-weight: 600; }
        .status.interrupted { background: #ef4444; color: #450a0a; font-weight: 600; }
        .waveform-container { height: 150px; border: 1px solid #334155; border-radius: 0.5rem; margin-bottom: 1rem; position: relative; overflow: hidden; background: #111827; }
        #waveform { width: 100%; height: 100%; }
        .mic-meter { margin-bottom: 1rem; font-size: .9rem; color: #94a3b8; padding: .4rem .6rem; background: #1e293b; border-radius: .25rem; display: inline-block; }
        .mic-meter.active { color: #052e16; background: #22c55e; font-weight: 600; }
        .controls { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; background: #3b82f6; color: white; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .log-area { height: 220px; overflow-y: auto; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; background: #111827; font-family: monospace; font-size: 0.85rem; line-height: 1.5; }
        .log-area .err { color: #f87171; }
        .log-area .ok { color: #4ade80; }
        .log-area .warn { color: #fbbf24; }
        .interrupt-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: bold; color: #ef4444; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .interrupt-overlay.active { opacity: 0.8; }
        .notice { background: #7c2d12; color: #fed7aa; padding: .75rem 1rem; border-radius: .5rem; margin-bottom: 1rem; font-size: .9rem; line-height: 1.5; display: none; }
        .notice.show { display: block; }
        .transcript { height: 240px; overflow-y: auto; border: 1px solid #334155; border-radius: .5rem; padding: .75rem; background: #111827; margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
        .transcript .hint { color: #64748b; font-size: .85rem; }
        .transcript .bubble { max-width: 85%; padding: .5rem .75rem; border-radius: .75rem; font-size: .92rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .transcript .bubble-user { align-self: flex-end; background: #1d4ed8; color: #eff6ff; border-bottom-right-radius: .2rem; }
        .transcript .bubble-user-live { align-self: flex-end; background: #334155; color: #cbd5e1; border-bottom-right-radius: .2rem; font-style: italic; opacity: .85; }
        .transcript .bubble-bot { align-self: flex-start; background: #14532d; color: #dcfce7; border-bottom-left-radius: .2rem; }
        .status.speaker-enrolled { background: #22c55e; color: #052e16; font-weight: 600; }
        .status.speaker-tentative { background: #a855f7; color: #2e1065; font-weight: 600; }
        .name-bar { display: none; gap: .5rem; align-items: center; margin-bottom: 1rem; padding: .6rem .75rem; background: #1e293b; border: 1px dashed #a855f7; border-radius: .5rem; font-size: .9rem; }
        .name-bar.show { display: flex; flex-wrap: wrap; }
        .name-bar input { flex: 1; min-width: 8rem; padding: .45rem .6rem; border: 1px solid #475569; border-radius: .35rem; background: #0f172a; color: #e2e8f0; font-size: .9rem; }
        .name-bar button { padding: .45rem .9rem; font-size: .9rem; }
        .name-bar button.ghost { background: #475569; }
    </style></head><body>
    <div class="header">
        <h1>🎤 VoiceHub 语音助手</h1>
        <p>实时语音交互（WebRTC），支持打断</p>
    </div>
    <div id="secure-notice" class="notice"></div>
    <div class="status-bar">
        <div class="status" id="connection-status">未连接</div>
        <div class="status" id="speech-status">等待麦克风</div>
        <div class="status" id="agent-status">点击开始通话</div>
        <div class="status" id="speaker-status">说话人：未识别</div>
    </div>
    <div class="waveform-container">
        <canvas id="waveform"></canvas>
        <div class="interrupt-overlay" id="interrupt-overlay">🔇 已打断</div>
    </div>
        <div class="mic-meter" id="mic-meter">麦克风电平：—</div>
        <div class="mic-meter" id="agent-meter">AI 语音轨道：未接收</div>
        <div id="mic-warn" class="notice"></div>
    <div class="controls">
        <button id="start-btn">🎙️ 开始通话</button>
        <button id="stop-btn" disabled>🔴 结束通话</button>
    </div>
    <div id="transcript" class="transcript"><div class="hint">对话转录将显示在这里：你说的话（蓝）和 AI 的回复（绿）。AI 回复同时也会用语音播报。</div></div>
    <div id="name-bar" class="name-bar">
        <span id="name-bar-hint">🎤 发现新声音</span>
        <input id="name-input" placeholder="给这位说话人起个名字" maxlength="16">
        <button id="name-save">命名</button>
        <button id="name-skip" class="ghost">忽略</button>
    </div>
    <div class="log-area" id="log-area"></div>
    <audio id="remote-audio" autoplay></audio>
    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const connectionStatus = document.getElementById('connection-status');
        const speechStatus = document.getElementById('speech-status');
        const agentStatus = document.getElementById('agent-status');
        const interruptOverlay = document.getElementById('interrupt-overlay');
        const logArea = document.getElementById('log-area');
        const waveformCanvas = document.getElementById('waveform');
        const waveformCtx = waveformCanvas.getContext('2d');
        const remoteAudio = document.getElementById('remote-audio');
        const secureNotice = document.getElementById('secure-notice');
        const micMeter = document.getElementById('mic-meter');
        const micWarn = document.getElementById('mic-warn');
        let _silenceSince = null;
        let _cleaningUp = false;
        let transcriptArea = document.getElementById('transcript');
        let _lastRole = null;
        let _openBubble = null;
        function createBubble(cls, text) {
            const el = document.createElement('div');
            el.className = 'bubble ' + cls;
            el.textContent = text;
            el.dataset.role = cls;
            transcriptArea.appendChild(el);
            transcriptArea.scrollTop = transcriptArea.scrollHeight;
            return el;
        }
        function addTranscript(role, text, isFinal) {
            if (role === 'user' && !isFinal) {
                if (_openBubble && _openBubble.dataset.role === 'bubble-user-live') {
                    _openBubble.textContent = '🎙️ 你（识别中）：' + text;
                } else {
                    _openBubble = createBubble('bubble-user-live', '🎙️ 你（识别中）：' + text);
                }
                _lastRole = 'user-live';
                return;
            }
            if (role === 'user' && isFinal) {
                if (_openBubble && _openBubble.dataset.role === 'bubble-user-live') _openBubble.remove();
                _openBubble = createBubble('bubble-user', '🗣️ 你：' + text);
                _lastRole = 'user';
                return;
            }
            // bot：连续分片合并到同一个气泡
            if (_lastRole === 'bot' && _openBubble) {
                _openBubble.textContent += text;
            } else {
                _openBubble = createBubble('bubble-bot', '🤖 AI：' + text);
            }
            _lastRole = 'bot';
            transcriptArea.scrollTop = transcriptArea.scrollHeight;
        }
        const speakerStatus = document.getElementById('speaker-status');
        const nameBar = document.getElementById('name-bar');
        const nameBarHint = document.getElementById('name-bar-hint');
        const nameInput = document.getElementById('name-input');
        let _pendingCluster = null;   // 等待命名的临时簇 id
        function updateSpeakerBadge(label, enrolled, confidence) {
            const pct = Math.round((confidence || 0) * 100);
            speakerStatus.textContent = (enrolled ? '🗣️ ' : '👤 ') + label + (enrolled ? '' : `（${pct}%）`);
            speakerStatus.className = 'status ' + (enrolled ? 'speaker-enrolled' : 'speaker-tentative');
        }
        async function enrollPending(name) {
            if (!_pendingCluster || !name) return;
            try {
                const res = await fetch('/api/voiceprints/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cluster_id: _pendingCluster, name })
                });
                if (res.ok) {
                    const snap = await res.json();
                    addLog(`✅ 已命名「${name}」，之后会自动识别`, 'ok');
                    updateSpeakerBadge(name, true, 1);
                    hideNameBar();
                    return snap;
                }
                const err = await res.json().catch(() => ({}));
                addLog(`命名失败：${err.error || res.status}`, 'err');
            } catch (ex) { addLog(`命名失败：${ex}`, 'err'); }
        }
        function hideNameBar() { _pendingCluster = null; nameBar.classList.remove('show'); nameInput.value = ''; }
        function handleAppMessage(e) {
            try {
                const msg = JSON.parse(e.data);
                if (!msg) return;
                if (msg.type === 'transcript') { addTranscript(msg.role, msg.text, !!msg.final); return; }
                if (msg.type === 'speaker') {
                    // enrolled 身份直接上徽标；临时簇也显示（提示"这是第几个声音"）。
                    // 同名重复事件去抖交给服务端（5s 冷却），前端只管渲染最新一条。
                    if (msg.speaker && msg.speaker !== _pendingCluster) updateSpeakerBadge(msg.speaker, !!msg.enrolled, msg.confidence);
                    if (msg.cluster_id && !msg.enrolled) {
                        // 攒段中的匿名声音不动 name-bar（等 speaker_found 再弹命名条）
                    }
                    return;
                }
                if (msg.type === 'speaker_found') {
                    // 新声音攒够段 → 弹命名条；同一簇只弹一次
                    if (msg.cluster_id && msg.cluster_id !== _pendingCluster) {
                        _pendingCluster = msg.cluster_id;
                        nameBarHint.textContent = `🎤 发现新声音（${msg.segments} 段语音），起个名字：`;
                        nameBar.classList.add('show');
                        nameInput.focus();
                        addLog(`发现新声音 ${msg.cluster_id}（${msg.segments} 段），请命名`, 'warn');
                    }
                    return;
                }
            } catch (_) {}
        }

        let pc = null;
        let localStream = null;
        let audioContext = null;
        let analyser = null;
        let rafId = null;
        let waveformData = new Array(100).fill(0);

        function addLog(message, cls) {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.textContent = `[${time}] ${message}`;
            if (cls) line.className = cls;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }
        function drawWaveform() {
            waveformCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
            const barWidth = waveformCanvas.width / waveformData.length;
            const centerY = waveformCanvas.height / 2;
            for (let i = 0; i < waveformData.length; i++) {
                const value = waveformData[i];
                const barHeight = Math.abs(value * centerY);
                const x = i * barWidth;
                const y = centerY - barHeight / 2;
                waveformCtx.fillStyle = value > 0 ? '#3b82f6' : '#ef4444';
                waveformCtx.fillRect(x, y, barWidth - 1, barHeight);
            }
        }
        function updateWaveform(audioBuffer) {
            const bufferLength = audioBuffer.length;
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) sum += Math.abs(audioBuffer[i]);
            waveformData.shift();
            waveformData.push(sum / bufferLength);
            drawWaveform();
        }
        function startWaveform(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const src = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            src.connect(analyser);
            const buf = new Uint8Array(analyser.fftSize);
            const tick = () => {
                analyser.getByteTimeDomainData(buf);
                let sum = 0;
                for (let i = 0; i < buf.length; i++) sum += Math.abs(buf[i] - 128) / 128;
                const level = sum / buf.length;
                waveformData.shift();
                waveformData.push(level);
                drawWaveform();
                // 实时麦克风电平（0..1），并检测长时间静音给出告警。
                const pct = Math.min(100, Math.round(level * 400));
                micMeter.textContent = `麦克风电平：${pct}%`;
                micMeter.className = 'mic-meter' + (pct > 2 ? ' active' : '');
                const now = performance.now();
                if (pct <= 2) {
                    if (_silenceSince === null) _silenceSince = now;
                    else if (now - _silenceSince > 2000) {
                        micWarn.classList.add('show');
                        micWarn.innerHTML = '⚠️ 麦克风超过 2 秒无信号：AI 收不到你的声音。' +
                            '请检查：① 此浏览器标签页是否在前台（切到别的窗口会暂停采集）；' +
                            '② 系统麦克风权限/默认输入设备是否选对；③ 说话音量是否过小。';
                    }
                } else {
                    _silenceSince = null;
                    micWarn.classList.remove('show');
                }
                rafId = requestAnimationFrame(tick);
            };
            tick();
        }
        function stopWaveform() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            if (audioContext) { audioContext.close(); audioContext = null; }
            analyser = null;
            waveformData = new Array(100).fill(0);
            drawWaveform();
            _silenceSince = null;
            micMeter.textContent = '麦克风电平：—';
            micMeter.className = 'mic-meter';
            micWarn.classList.remove('show');
        }

        function waitForIceGathering(pc) {
            return new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') return resolve();
                const check = () => {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', check);
                        resolve();
                    }
                };
                pc.addEventListener('icegatheringstatechange', check);
                // 兜底超时：局域网通常在 1s 内收集完 host 候选
                setTimeout(resolve, 1500);
            });
        }

        async function startCall() {
            // 安全上下文检查：麦克风只在 HTTPS 或 localhost 可用
            if (!window.isSecureContext) {
                secureNotice.classList.add('show');
                secureNotice.innerHTML = '⚠️ 当前页面不是“安全上下文”，浏览器会禁止访问麦克风。' +
                    '请通过 <b>https://</b> 访问本服务（本服务已启用自签证书，' +
                    '首次打开需在浏览器中点击“继续前往/高级→继续”以信任证书）。';
                addLog('非安全上下文：getUserMedia 不可用', 'err');
                return;
            }
            startBtn.disabled = true;
            _cleaningUp = false;
            connectionStatus.className = 'status connecting';
            connectionStatus.textContent = '连接中…';
            addLog('正在获取麦克风权限…');
            try {
                // 用默认音频设备，最大化兼容性（避免 echoCancellation 等约束触发 OverconstrainedError）
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                let hint;
                if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    hint = '本机未检测到麦克风：请确认已插入麦克风/耳机，并在 系统设置→隐私→麦克风 中允许访问';
                } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    hint = '麦克风权限被拒绝：点地址栏“锁”图标，把麦克风设为“允许”后重试';
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    hint = '麦克风被其他程序占用（会议/录音软件等），请关闭后重试';
                } else {
                    hint = `错误类型 ${err.name}`;
                }
                addLog(`麦克风授权失败: ${err.name} — ${hint}`, 'err');
                connectionStatus.className = 'status interrupted';
                connectionStatus.textContent = '麦克风失败';
                startBtn.disabled = false;
                return;
            }
            speechStatus.textContent = '麦克风已开启';
            startWaveform(localStream);
            addLog('麦克风已就绪，正在建立 WebRTC 连接…');

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            // 监测麦克风轨道被浏览器/系统意外结束（设备释放、标签页切到后台等），
            // 一旦 ended 立即提示，让用户区分"麦克风断了"与"AI 没回复"。
            localStream.getAudioTracks().forEach(t => {
                t.onended = () => {
                    if (_cleaningUp) return;  // 主动停止（cleanupCall）不提示
                    addLog('⚠️ 麦克风音频流已结束（设备被释放/标签页失焦），请重新点击“开始通话”', 'err');
                    const w = document.getElementById('mic-warn');
                    w.classList.add('show');
                    w.innerHTML = '⚠️ 麦克风音频流已断开（track ended）：AI 收不到你的声音。常见原因：① 测试时把浏览器标签页切到后台（Chrome 会暂停后台麦克风采集）；② 麦克风设备被其它程序释放或掉线。请重新点击“开始通话”。';
                };
            });

            // 数据通道：用于接收服务端推送的"文字转录"（你说了什么 / AI 回了什么），
            // 与 TTS 音频并行，保证即使扬声器无声也能在页面上看到对话内容。
            const dc = pc.createDataChannel('voicehub');
            dc.onmessage = handleAppMessage;
            pc.ondatachannel = (e) => { e.channel.onmessage = handleAppMessage; };

            pc.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                // 显式 play()：部分浏览器对“异步设置的 srcObject + autoplay”会拦截，
                // 导致 AI 语音轨道收到了却不出声。这里强制播放并捕获拦截异常。
                remoteAudio.play().catch((e) => addLog('AI 语音播放被拦截: ' + e.message, 'warn'));
                const m = document.getElementById('agent-meter');
                m.textContent = 'AI 语音轨道：已接收 ▶';
                m.className = 'mic-meter active';
                addLog('收到远端音频流（AI 语音）', 'ok');
            };
            pc.onconnectionstatechange = () => {
                addLog(`WebRTC 状态: ${pc.connectionState}`);
                if (pc.connectionState === 'connected') {
                    connectionStatus.className = 'status active';
                    connectionStatus.textContent = '已连接';
                    agentStatus.textContent = '通话中（直接说话即可）';
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    connectionStatus.className = 'status interrupted';
                    connectionStatus.textContent = '连接中断';
                }
            };

            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await waitForIceGathering(pc);

                const payload = {
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type,
                    pc_id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()))
                };
                addLog('发送 SDP offer 到 /offer …');
                const resp = await fetch('/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    const txt = await resp.text();
                    throw new Error(`/offer 返回 ${resp.status}: ${txt}`);
                }
                const answer = await resp.json();
                if (!answer.sdp) throw new Error('服务端未返回 SDP answer');
                await pc.setRemoteDescription({ type: answer.type || 'answer', sdp: answer.sdp });
                addLog('收到 SDP answer，连接建立中…', 'ok');
                stopBtn.disabled = false;
            } catch (err) {
                addLog(`呼叫失败: ${err.message}`, 'err');
                connectionStatus.className = 'status interrupted';
                connectionStatus.textContent = '呼叫失败';
                cleanupCall();
            }
        }

        function cleanupCall() {
            _cleaningUp = true;
            if (pc) { try { pc.close(); } catch (e) {} pc = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            remoteAudio.srcObject = null;
            stopWaveform();
            // 重置转录面板（保留提示语）
            transcriptArea.innerHTML = '<div class="hint">对话转录将显示在这里：你说的话（蓝）和 AI 的回复（绿）。AI 回复同时也会用语音播报。</div>';
            _lastRole = null;
            _openBubble = null;
            speechStatus.textContent = '等待麦克风';
            agentStatus.textContent = '点击开始通话';
            speakerStatus.textContent = '说话人：未识别';
            speakerStatus.className = 'status';
            hideNameBar();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            _cleaningUp = false;
        }

        startBtn.addEventListener('click', startCall);
        document.getElementById('name-save').addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) { nameInput.focus(); return; }
            enrollPending(name);
        });
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && nameInput.value.trim()) enrollPending(nameInput.value.trim());
        });
        document.getElementById('name-skip').addEventListener('click', () => {
            addLog('已忽略该匿名声音（本次通话不再提示）');
            hideNameBar();
        });
        stopBtn.addEventListener('click', () => {
            addLog('结束通话');
            cleanupCall();
            connectionStatus.className = 'status';
            connectionStatus.textContent = '未连接';
        });

        window.addEventListener('resize', () => {
            waveformCanvas.width = waveformCanvas.clientWidth;
            waveformCanvas.height = waveformCanvas.clientHeight;
            drawWaveform();
        });
        window.dispatchEvent(new Event('resize'));
        addLog('客户端就绪。请点击“开始通话”（需通过 https 访问以启用麦克风）。');
    </script></body></html>
